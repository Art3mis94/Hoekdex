<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoekedex - Animated Creature Directory</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #475569;
      --badge-fire: #ef4444;
      --badge-water: #3b82f6;
      --badge-grass: #10b981;
      --badge-electric: #f59e0b;
      --badge-psychic: #ec4899;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding: 2rem;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    input, select, button {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      outline: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    button {
      cursor: pointer;
      background-color: var(--accent);
      border: none;
      font-weight: 600;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    .view-btn-group {
      display: flex;
      gap: 0.25rem;
      background-color: var(--bg-secondary);
      padding: 0.25rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
    }

    .view-btn-group button {
      background: transparent;
      border: none;
      border-radius: 0.3rem;
      padding: 0.4rem 0.8rem;
    }

    .view-btn-group button.active {
      background-color: var(--accent);
    }

    /* Grid View */
    .dex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .card-id {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 700;
    }

    .sprite-container {
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1rem 0;
    }

    .sprite {
      max-width: 100%;
      max-height: 100%;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .card-title {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      text-transform: capitalize;
    }

    .badges {
      display: flex;
      gap: 0.5rem;
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 1rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .badge-fire { background-color: var(--badge-fire); }
    .badge-water { background-color: var(--badge-water); }
    .badge-grass { background-color: var(--badge-grass); }
    .badge-electric { background-color: var(--badge-electric); color: #000; }
    .badge-psychic { background-color: var(--badge-psychic); }

    .fav-btn {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0;
      color: var(--text-sub);
    }

    .fav-btn.active {
      color: #f59e0b;
    }

    /* List View Overrides */
    .dex-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .dex-list .card {
      flex-direction: row;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
    }

    .dex-list .sprite-container {
      width: 50px;
      height: 50px;
      margin: 0;
    }

    .dex-list .card-id, .dex-list .fav-btn {
      position: static;
    }

    .dex-list-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 1rem;
      width: 90%;
      max-width: 500px;
      padding: 2rem;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-sub);
      cursor: pointer;
    }

    .stat-bar {
      margin-top: 1rem;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.25rem;
      font-size: 0.85rem;
    }

    .bar-bg {
      background-color: var(--bg-primary);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .bar-fill {
      height: 100%;
      background-color: var(--accent);
      width: 0%;
      transition: width 0.5s ease-out;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Hoekedex</h1>
    <div class="controls">
      <input type="text" id="search" placeholder="Search by name...">
      <select id="type-filter">
        <option value="all">All Types</option>
        <option value="fire">Fire</option>
        <option value="water">Water</option>
        <option value="grass">Grass</option>
        <option value="electric">Electric</option>
        <option value="psychic">Psychic</option>
      </select>
      <div class="view-btn-group">
        <button id="view-grid" class="active">Grid</button>
        <button id="view-list">List</button>
      </div>
    </div>
  </header>

  <main id="dex-container" class="dex-grid"></main>

  <!-- Profile View Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <button class="close-btn" id="close-modal">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    // Mock Data Dataset
    const creatures = [
      { id: '001', name: 'Pyronix', type: 'fire', hp: 60, atk: 85, def: 50, sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png', evo: 'Pyronix -> Ignisaur (Lvl 16)' },
      { id: '002', name: 'Aquatail', type: 'water', hp: 70, atk: 55, def: 80, sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png', evo: 'Aquatail -> Hydrofin (Lvl 18)' },
      { id: '003', name: 'Leafwing', type: 'grass', hp: 65, atk: 60, def: 60, sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png', evo: 'Leafwing -> Floragon (Lvl 16)' },
      { id: '004', name: 'Voltix', type: 'electric', hp: 45, atk: 90, def: 40, sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png', evo: 'Voltix -> Raichu (Stone)' },
      { id: '005', name: 'Mindmeld', type: 'psychic', hp: 50, atk: 95, def: 45, sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/63.png', evo: 'Mindmeld -> Alakazam (Trade)' }
    ];

    let favorites = JSON.parse(localStorage.getItem('hoekedex_favs')) || [];
    let currentView = 'grid';

    const container = document.getElementById('dex-container');
    const searchInput = document.getElementById('search');
    const typeFilter = document.getElementById('type-filter');
    const btnGrid = document.getElementById('view-grid');
    const btnList = document.getElementById('view-list');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalContent = document.getElementById('modal-content');
    const closeModal = document.getElementById('close-modal');

    // Filter & Render
    function render() {
      const query = searchInput.value.toLowerCase();
      const selectedType = typeFilter.value;

      const filtered = creatures.filter(c => {
        const matchesName = c.name.toLowerCase().includes(query);
        const matchesType = selectedType === 'all' || c.type === selectedType;
        return matchesName && matchesType;
      });

      container.className = currentView === 'grid' ? 'dex-grid' : 'dex-list';
      container.innerHTML = '';

      filtered.forEach(c => {
        const isFav = favorites.includes(c.id);
        const card = document.createElement('div');
        card.className = 'card';

        if (currentView === 'grid') {
          card.innerHTML = `
            <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${c.id}')">★</button>
            <span class="card-id">#${c.id}</span>
            <div class="sprite-container">
              <img class="sprite" src="${c.sprite}" alt="${c.name}">
            </div>
            <h3 class="card-title">${c.name}</h3>
            <div class="badges">
              <span class="badge badge-${c.type}">${c.type}</span>
            </div>
          `;
        } else {
          card.innerHTML = `
            <div class="dex-list-left">
              <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${c.id}')">★</button>
              <span class="card-id">#${c.id}</span>
              <div class="sprite-container">
                <img class="sprite" src="${c.sprite}" alt="${c.name}">
              </div>
              <h3 class="card-title">${c.name}</h3>
            </div>
            <div class="badges">
              <span class="badge badge-${c.type}">${c.type}</span>
            </div>
          `;
        }

        card.addEventListener('click', () => openProfile(c));
        container.appendChild(card);
      });
    }

    // Toggle Favorites Persistence
    window.toggleFav = function(e, id) {
      e.stopPropagation();
      if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('hoekedex_favs', JSON.stringify(favorites));
      render();
    };

    // Profile Modal View
    function openProfile(creature) {
      modalContent.innerHTML = `
        <div style="text-align: center;">
          <img src="${creature.sprite}" style="width: 120px; height: 120px;" alt="${creature.name}">
          <h2 style="text-transform: capitalize; margin: 0.5rem 0;">${creature.name} (#${creature.id})</h2>
          <span class="badge badge-${creature.type}">${creature.type}</span>
          <p style="color: var(--text-sub); font-size: 0.85rem; margin-top: 0.75rem;"><strong>Evolution:</strong> ${creature.evo}</p>
        </div>
        <div class="stat-bar">
          <div class="stat-row"><span>HP</span><span>${creature.hp}</span></div>
          <div class="bar-bg"><div class="bar-fill" id="hp-bar"></div></div>
          <div class="stat-row"><span>Attack</span><span>${creature.atk}</span></div>
          <div class="bar-bg"><div class="bar-fill" id="atk-bar"></div></div>
          <div class="stat-row"><span>Defense</span><span>${creature.def}</span></div>
          <div class="bar-bg"><div class="bar-fill" id="def-bar"></div></div>
        </div>
      `;

      modalOverlay.classList.add('active');

      // Animate stat bars after render
      setTimeout(() => {
        document.getElementById('hp-bar').style.width = `${(creature.hp / 120) * 100}%`;
        document.getElementById('atk-bar').style.width = `${(creature.atk / 120) * 100}%`;
        document.getElementById('def-bar').style.width = `${(creature.def / 120) * 100}%`;
      }, 50);
    }

    // Event Listeners
    searchInput.addEventListener('input', render);
    typeFilter.addEventListener('change', render);

    btnGrid.addEventListener('click', () => {
      currentView = 'grid';
      btnGrid.classList.add('active');
      btnList.classList.remove('active');
      render();
    });

    btnList.addEventListener('click', () => {
      currentView = 'list';
      btnList.classList.add('active');
      btnGrid.classList.remove('active');
      render();
    });

    closeModal.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    });

    // Initial render
    render();
  </script>
</body>
</html>
