<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roster & Custom Encounter Tracker</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      
      --common: #94a3b8;
      --rare: #3b82f6;
      --ultra-rare: #a855f7;
      --legendary: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      padding: 2rem;
      min-height: 100vh;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .stats-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .stat-badge {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .stat-badge strong {
      color: var(--accent);
      font-size: 1.1rem;
    }

    .filter-bar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      background: var(--bg-card);
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
    }

    input, select, button, textarea {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.5rem 0.8rem;
      border-radius: 0.5rem;
      outline: none;
      font-size: 0.9rem;
    }

    button {
      cursor: pointer;
      background: var(--accent);
      border: none;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    .view-toggle {
      display: flex;
      margin-left: auto;
      background: var(--bg-dark);
      border-radius: 0.5rem;
      padding: 0.25rem;
      border: 1px solid var(--border);
    }

    .view-toggle button {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 0.3rem;
      font-size: 0.85rem;
    }

    .view-toggle button.active {
      background: var(--accent);
      color: white;
    }

    .roster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .avatar-wrapper {
      position: relative;
      margin-bottom: 0.75rem;
      display: inline-block;
    }

    .avatar-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--border);
      display: block;
    }

    .badge-common { border-color: var(--common); }
    .badge-rare { border-color: var(--rare); }
    .badge-ultra-rare { border-color: var(--ultra-rare); }
    .badge-legendary { border-color: var(--legendary); }

    .rarity-tag {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 0.15rem 0.5rem;
      border-radius: 1rem;
      color: #fff;
      white-space: nowrap;
      z-index: 2;
    }

    .tag-common { background: var(--common); color: #000; }
    .tag-rare { background: var(--rare); }
    .tag-ultra-rare { background: var(--ultra-rare); }
    .tag-legendary { background: var(--legendary); color: #000; }

    .card-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .rating {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .rating-common { color: var(--common); }
    .rating-rare { color: var(--rare); }
    .rating-ultra-rare { color: var(--ultra-rare); }
    .rating-legendary { color: var(--legendary); }

    .evo-container {
      width: 100%;
      margin-top: 0.5rem;
    }

    .evo-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .evo-bar-bg {
      background: var(--bg-dark);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
    }

    .evo-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    .roster-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .roster-list .card {
      flex-direction: row;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
    }

    .roster-list .avatar-wrapper {
      margin-bottom: 0;
    }

    .roster-list .avatar-circle {
      width: 50px;
      height: 50px;
    }

    .roster-list .rarity-tag {
      display: none;
    }

    .list-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .list-meta {
      display: flex;
      gap: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      align-items: center;
    }

    .profile-badges {
      margin-top: 1rem;
      text-align: left;
    }

    .profile-badges h4 {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .character-badge {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      padding: 0.3rem 0.6rem;
      border-radius: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .character-badge.b-common { border-color: var(--common); }
    .character-badge.b-rare { border-color: var(--rare); }
    .character-badge.b-ultra-rare { border-color: var(--ultra-rare); }
    .character-badge.b-legendary { border-color: var(--legendary); }

    .modal-avatar-container {
      position: relative;
      display: inline-block;
      margin-bottom: 0.5rem;
    }

    .avatar-action-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 5;
    }

    .modal-avatar-container:hover .avatar-action-overlay {
      opacity: 1;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0;
    }

    .icon-btn:hover {
      background: var(--accent);
    }

    .icon-btn.delete-btn:hover {
      background: var(--danger);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      width: 90%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.75rem;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 1rem; right: 1rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 1rem;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .badge-section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 0.5rem;
      margin-bottom: 0.25rem;
    }

    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 0.4rem;
      background: var(--bg-dark);
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      max-height: 180px;
      overflow-y: auto;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .checkbox-label input {
      width: auto;
    }

    .modal-stats {
      margin-top: 1rem;
      background: var(--bg-dark);
      padding: 1rem;
      border-radius: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .encounter-history {
      margin-top: 1rem;
      text-align: left;
    }

    .encounter-history h4 {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .log-item {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      padding: 0.75rem;
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      position: relative;
    }

    .log-item-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.25rem;
      padding-right: 1.5rem;
    }

    .delete-log-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
    }

    .delete-log-btn:hover {
      color: var(--danger);
    }

    .action-btn {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="stats-header">
        <h1>Roster Tracker</h1>
        <div class="stat-badge">Total Logs: <strong id="total-logs-count">0</strong></div>
      </div>
      <button id="open-add-modal">+ Add New Character</button>
    </div>

    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="Search name...">
      
      <select id="race-filter">
        <option value="all">All Races</option>
        <option value="Human">Human</option>
        <option value="Elf">Elf</option>
        <option value="Cyborg">Cyborg</option>
      </select>

      <select id="hair-filter">
        <option value="all">All Hair Colors</option>
        <option value="Blonde">Blonde</option>
        <option value="Dark">Dark</option>
        <option value="Silver">Silver</option>
        <option value="Red">Red</option>
      </select>

      <select id="rating-filter">
        <option value="all">All Highest Ratings</option>
        <option value="Common">Common Rated</option>
        <option value="Rare">Rare Rated</option>
        <option value="Ultra-Rare">Ultra-Rare Rated</option>
        <option value="Legendary">Legendary Rated</option>
      </select>

      <div class="view-toggle">
        <button id="btn-grid" class="active">Square</button>
        <button id="btn-list">List</button>
      </div>
    </div>
  </header>

  <main id="roster-container" class="roster-grid"></main>

  <!-- Detailed Character Profile View Modal -->
  <div class="modal-overlay" id="profile-modal-overlay">
    <div class="modal" style="text-align: center;">
      <button class="close-btn" id="close-profile-modal">&times;</button>
      <div id="profile-modal-content"></div>
    </div>
  </div>

  <!-- Add Character Modal -->
  <div class="modal-overlay" id="add-modal-overlay">
    <div class="modal">
      <button class="close-btn" id="close-add-modal">&times;</button>
      <h2 style="margin-bottom: 1.25rem;">Add New Character</h2>
      <form id="add-character-form">
        <div class="form-group">
          <label for="add-name">Character Name</label>
          <input type="text" id="add-name" required placeholder="e.g. Elena Vane">
        </div>
        <div class="form-group">
          <label for="add-race">Race</label>
          <select id="add-race">
            <option value="Human">Human</option>
            <option value="Elf">Elf</option>
            <option value="Cyborg">Cyborg</option>
          </select>
        </div>
        <div class="form-group">
          <label for="add-hair">Hair Color</label>
          <select id="add-hair">
            <option value="Blonde">Blonde</option>
            <option value="Dark">Dark</option>
            <option value="Silver">Silver</option>
            <option value="Red">Red</option>
          </select>
        </div>
        <div class="form-group">
          <label for="add-avatar">Avatar Image URL</label>
          <input type="url" id="add-avatar" placeholder="https://..." value="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80">
        </div>
        <button type="submit" class="action-btn">Save to Roster</button>
      </form>
    </div>
  </div>

  <!-- Edit Character Modal -->
  <div class="modal-overlay" id="edit-modal-overlay">
    <div class="modal">
      <button class="close-btn" id="close-edit-modal">&times;</button>
      <h2 style="margin-bottom: 1.25rem;">Edit Character Details</h2>
      <form id="edit-character-form">
        <div class="form-group">
          <label for="edit-name">Character Name</label>
          <input type="text" id="edit-name" required>
        </div>
        <div class="form-group">
          <label for="edit-race">Race</label>
          <select id="edit-race">
            <option value="Human">Human</option>
            <option value="Elf">Elf</option>
            <option value="Cyborg">Cyborg</option>
          </select>
        </div>
        <div class="form-group">
          <label for="edit-hair">Hair Color</label>
          <select id="edit-hair">
            <option value="Blonde">Blonde</option>
            <option value="Dark">Dark</option>
            <option value="Silver">Silver</option>
            <option value="Red">Red</option>
          </select>
        </div>
        <div class="form-group">
          <label for="edit-avatar">Avatar Photo URL</label>
          <input type="url" id="edit-avatar" required>
        </div>
        <button type="submit" class="action-btn">Update Character</button>
      </form>
    </div>
  </div>

  <!-- Add Encounter Modal -->
  <div class="modal-overlay" id="encounter-modal-overlay">
    <div class="modal">
      <button class="close-btn" id="close-encounter-modal">&times;</button>
      <h2 style="margin-bottom: 1.25rem;">Log Encounter & Select Badges</h2>
      <form id="add-encounter-form">
        <div class="form-group">
          <label for="enc-type">Encounter Type</label>
          <select id="enc-type">
            <option value="Quest">Quest</option>
            <option value="Training">Training</option>
            <option value="Social">Social</option>
            <option value="Boss Raid">Boss Raid</option>
          </select>
        </div>
        <div class="form-group">
          <label for="enc-date">Date</label>
          <input type="date" id="enc-date" required>
        </div>
        <div class="form-group">
          <label for="enc-location">Location / Realm</label>
          <input type="text" id="enc-location" required placeholder="e.g. Ironforge Outpost">
        </div>

        <div class="form-group">
          <label>Earned Encounter Badges</label>
          <div class="checkbox-group" id="badge-checkbox-list"></div>
        </div>

        <div class="form-group">
          <label for="enc-notes">Notes</label>
          <textarea id="enc-notes" rows="2" placeholder="Write event notes..."></textarea>
        </div>
        <button type="submit" class="action-btn">Log Encounter</button>
      </form>
    </div>
  </div>

  <script>
    // System Badges defined by tier rarity
    const BADGES_CONFIG = [
      { name: "Apex Mastery 👑", rarity: "Legendary", rank: 4 },
      
      { name: "Flawless Execution 💎", rarity: "Ultra-Rare", rank: 3 },
      { name: "MVP Contender 🌟", rarity: "Ultra-Rare", rank: 3 },
      { name: "Boss Slayer 🐉", rarity: "Ultra-Rare", rank: 3 },
      { name: "Tactical Genius 🧠", rarity: "Ultra-Rare", rank: 3 },
      
      { name: "Critical Strike 💥", rarity: "Rare", rank: 2 },
      { name: "First Blood ⚡", rarity: "Rare", rank: 2 },
      { name: "Unshakable Shield 🛡️", rarity: "Rare", rank: 2 },
      { name: "Speed Demon 🚀", rarity: "Rare", rank: 2 },
      
      { name: "Participant 🎖️", rarity: "Common", rank: 1 },
      { name: "Team Player 🤝", rarity: "Common", rank: 1 },
      { name: "Scout Duty 🔍", rarity: "Common", rank: 1 },
      { name: "First Step 🐾", rarity: "Common", rank: 1 }
    ];

    let characters = JSON.parse(localStorage.getItem('roster_characters_v5')) || [
      {
        id: "001",
        name: "Aria Shadow",
        race: "Elf",
        hair: "Silver",
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80",
        logs: [
          { 
            id: "log-1", 
            type: "Boss Raid", 
            date: "2026-03-12", 
            location: "Moonlit Citadel", 
            badges: ["Apex Mastery 👑", "MVP Contender 🌟"], 
            notes: "Cleared raid with maximum efficiency." 
          }
        ]
      }
    ];

    let currentView = 'grid';
    let selectedCharacterId = null;

    // DOM Elements
    const container = document.getElementById('roster-container');
    const totalLogsEl = document.getElementById('total-logs-count');
    const searchInput = document.getElementById('search-input');
    const raceFilter = document.getElementById('race-filter');
    const hairFilter = document.getElementById('hair-filter');
    const ratingFilter = document.getElementById('rating-filter');
    const btnGrid = document.getElementById('btn-grid');
    const btnList = document.getElementById('btn-list');

    const profileOverlay = document.getElementById('profile-modal-overlay');
    const profileContent = document.getElementById('profile-modal-content');
    const closeProfile = document.getElementById('close-profile-modal');

    const addOverlay = document.getElementById('add-modal-overlay');
    const openAddBtn = document.getElementById('open-add-modal');
    const closeAdd = document.getElementById('close-add-modal');
    const addForm = document.getElementById('add-character-form');

    const editOverlay = document.getElementById('edit-modal-overlay');
    const closeEdit = document.getElementById('close-edit-modal');
    const editForm = document.getElementById('edit-character-form');

    const encounterOverlay = document.getElementById('encounter-modal-overlay');
    const closeEncounter = document.getElementById('close-encounter-modal');
    const encounterForm = document.getElementById('add-encounter-form');
    const badgeCheckboxList = document.getElementById('badge-checkbox-list');

    function saveState() {
      localStorage.setItem('roster_characters_v5', JSON.stringify(characters));
    }

    function updateTotalLogsHeader() {
      const total = characters.reduce((acc, c) => acc + c.logs.length, 0);
      totalLogsEl.textContent = total;
    }

    // Calculates Level based on requested encounter progression thresholds:
    // Level 1 -> 2: 5 encounters
    // Level 2 -> 3: 5 more (10 total)
    // Level 3 -> 4: 10 more (20 total)
    // Level 4 -> 5: 20 more (40 total)
    function calculateEncounterLevel(encounterCount) {
      if (encounterCount < 5) {
        return { level: 1, current: encounterCount, max: 5, progress: (encounterCount / 5) * 100 };
      } else if (encounterCount < 10) {
        return { level: 2, current: encounterCount - 5, max: 5, progress: ((encounterCount - 5) / 5) * 100 };
      } else if (encounterCount < 20) {
        return { level: 3, current: encounterCount - 10, max: 10, progress: ((encounterCount - 10) / 10) * 100 };
      } else if (encounterCount < 40) {
        return { level: 4, current: encounterCount - 20, max: 20, progress: ((encounterCount - 20) / 20) * 100 };
      } else {
        return { level: 5, current: encounterCount, max: 40, progress: 100 };
      }
    }

    // Determine highest rarity rank achieved from all ticked badges
    function calculateHighestRating(logs) {
      let maxRank = 0;
      let highestRarity = "None";

      logs.forEach(log => {
        if (log.badges) {
          log.badges.forEach(badgeName => {
            const conf = BADGES_CONFIG.find(b => b.name === badgeName);
            if (conf && conf.rank > maxRank) {
              maxRank = conf.rank;
              highestRarity = conf.rarity;
            }
          });
        }
      });

      return { rarity: highestRarity, rank: maxRank };
    }

    function getRarityClass(rarity) {
      return rarity.toLowerCase().replace(' ', '-');
    }

    function renderBadgeCheckboxes() {
      badgeCheckboxList.innerHTML = '';
      BADGES_CONFIG.forEach(b => {
        const label = document.createElement('label');
        label.className = 'checkbox-label';
        const rClass = getRarityClass(b.rarity);
        label.innerHTML = `
          <input type="checkbox" name="encounter-badges" value="${b.name}">
          <span>${b.name} <small style="color:var(--text-muted);">(${b.rarity})</small></span>
        `;
        badgeCheckboxList.appendChild(label);
      });
    }

    function render() {
      const query = searchInput.value.toLowerCase();
      const race = raceFilter.value;
      const hair = hairFilter.value;
      const selectedRating = ratingFilter.value;

      const filtered = characters.filter(item => {
        const matchesName = item.name.toLowerCase().includes(query);
        const matchesRace = race === 'all' || item.race === race;
        const matchesHair = hair === 'all' || item.hair === hair;
        
        const ratingInfo = calculateHighestRating(item.logs);
        const matchesRating = selectedRating === 'all' || ratingInfo.rarity === selectedRating;

        return matchesName && matchesRace && matchesHair && matchesRating;
      });

      container.className = currentView === 'grid' ? 'roster-grid' : 'roster-list';
      container.innerHTML = '';

      filtered.forEach(item => {
        const totalEncounters = item.logs.length;
        const levelInfo = calculateEncounterLevel(totalEncounters);
        const ratingInfo = calculateHighestRating(item.logs);
        const rClass = getRarityClass(ratingInfo.rarity);
        
        const card = document.createElement('div');
        card.className = 'card';

        if (currentView === 'grid') {
          card.innerHTML = `
            <div class="avatar-wrapper">
              <span class="rarity-tag tag-${rClass}">${ratingInfo.rarity}</span>
              <img src="${item.avatar}" class="avatar-circle badge-${rClass}" alt="${item.name}">
            </div>
            <div class="card-name">${item.name}</div>
            <div class="rating rating-${rClass}">Highest: ${ratingInfo.rarity}</div>
            <div class="evo-container">
              <div class="evo-header">
                <span>Level ${levelInfo.level} (${totalEncounters} Encounters)</span>
                <span>${Math.round(levelInfo.progress)}%</span>
              </div>
              <div class="evo-bar-bg">
                <div class="evo-bar-fill" style="width: ${levelInfo.progress}%"></div>
              </div>
            </div>
          `;
        } else {
          card.innerHTML = `
            <div class="list-info">
              <div class="avatar-wrapper">
                <img src="${item.avatar}" class="avatar-circle badge-${rClass}" alt="${item.name}">
              </div>
              <div>
                <div class="card-name">${item.name}</div>
                <div class="rating rating-${rClass}">Highest: ${ratingInfo.rarity}</div>
              </div>
            </div>
            <div class="list-meta">
              <span><strong>Race:</strong> ${item.race}</span>
              <span><strong>Hair:</strong> ${item.hair}</span>
              <span><strong>Level:</strong> ${levelInfo.level}</span>
              <span><strong>Encounters:</strong> ${totalEncounters}</span>
            </div>
          `;
        }

        card.addEventListener('click', () => openProfileModal(item.id));
        container.appendChild(card);
      });

      updateTotalLogsHeader();
      saveState();
    }

    function openProfileModal(id) {
      selectedCharacterId = id;
      const item = characters.find(c => c.id === id);
      if (!item) return;

      const totalEncounters = item.logs.length;
      const levelInfo = calculateEncounterLevel(totalEncounters);
      const ratingInfo = calculateHighestRating(item.logs);
      const rClass = getRarityClass(ratingInfo.rarity);

      // Collect earned badges
      const earnedBadgesSet = new Set();
      item.logs.forEach(l => {
        if (l.badges) l.badges.forEach(b => earnedBadgesSet.add(b));
      });

      let badgesHTML = Array.from(earnedBadgesSet).map(bName => {
        const conf = BADGES_CONFIG.find(c => c.name === bName);
        const badgeClass = conf ? getRarityClass(conf.rarity) : 'common';
        return `<span class="character-badge b-${badgeClass}">${bName}</span>`;
      }).join('');

      if (!badgesHTML) {
        badgesHTML = '<span style="color:var(--text-muted); font-size:0.8rem;">No encounter badges earned yet.</span>';
      }

      let logsHTML = item.logs.map(l => `
        <div class="log-item">
          <button class="delete-log-btn" title="Delete Encounter" onclick="deleteEncounter('${l.id}')">&times;</button>
          <div class="log-item-header">
            <span>${l.type}</span>
            <span>${l.date}</span>
          </div>
          <div><strong>Location:</strong> ${l.location}</div>
          ${l.badges && l.badges.length ? `<div style="margin-top:0.25rem;">${l.badges.map(b => `<span class="character-badge" style="display:inline-block; margin-right:0.2rem; font-size:0.7rem;">${b}</span>`).join('')}</div>` : ''}
          ${l.notes ? `<div style="color:var(--text-muted); margin-top:0.2rem;">${l.notes}</div>` : ''}
        </div>
      `).join('');

      profileContent.innerHTML = `
        <div class="modal-avatar-container">
          <span class="rarity-tag tag-${rClass}">${ratingInfo.rarity}</span>
          <img src="${item.avatar}" class="avatar-circle badge-${rClass}" style="width:120px; height:120px;" alt="${item.name}">
          <div class="avatar-action-overlay">
            <button class="icon-btn" title="Edit Character" onclick="openEditModal('${item.id}')">✏️</button>
            <button class="icon-btn delete-btn" title="Delete Person" onclick="deleteCharacter('${item.id}')">🗑️</button>
          </div>
        </div>

        <h2 style="margin-top:0.5rem;">${item.name}</h2>
        <div class="rating rating-${rClass}" style="font-size:1.0rem; margin-bottom:0.5rem;">Highest Rating: ${ratingInfo.rarity}</div>
        
        <div class="evo-container" style="margin-bottom: 1rem;">
          <div class="evo-header">
            <span>Level Progression (Level ${levelInfo.level})</span>
            <span>${totalEncounters} Encounters Total</span>
          </div>
          <div class="evo-bar-bg">
            <div class="evo-bar-fill" style="width: ${levelInfo.progress}%"></div>
          </div>
        </div>

        <div class="modal-stats">
          <div class="stat-row"><span>Race</span><strong>${item.race}</strong></div>
          <div class="stat-row"><span>Hair Color</span><strong>${item.hair}</strong></div>
          <div class="stat-row"><span>Level Tier</span><strong>Level ${levelInfo.level}</strong></div>
          <div class="stat-row"><span>Total Encounters</span><strong>${totalEncounters}</strong></div>
        </div>

        <div class="profile-badges">
          <h4>Unlocked Encounter Badges</h4>
          <div class="badge-tags">${badgesHTML}</div>
        </div>

        <button class="action-btn" onclick="openEncounterModal()">+ Log New Encounter</button>

        <div class="encounter-history">
          <h4>Encounter Logs (${item.logs.length})</h4>
          ${logsHTML || '<div style="color:var(--text-muted); font-size:0.85rem;">No encounters logged yet.</div>'}
        </div>
      `;
      profileOverlay.classList.add('active');
    }

    window.deleteCharacter = function(id) {
      if (confirm("Are you sure you want to delete this character and all their encounters?")) {
        characters = characters.filter(c => c.id !== id);
        profileOverlay.classList.remove('active');
        render();
      }
    };

    window.openEditModal = function(id) {
      const item = characters.find(c => c.id === id);
      if (!item) return;

      document.getElementById('edit-name').value = item.name;
      document.getElementById('edit-race').value = item.race;
      document.getElementById('edit-hair').value = item.hair;
      document.getElementById('edit-avatar').value = item.avatar;

      editOverlay.classList.add('active');
    };

    editForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const item = characters.find(c => c.id === selectedCharacterId);
      if (item) {
        item.name = document.getElementById('edit-name').value;
        item.race = document.getElementById('edit-race').value;
        item.hair = document.getElementById('edit-hair').value;
        item.avatar = document.getElementById('edit-avatar').value;

        editOverlay.classList.remove('active');
        render();
        openProfileModal(selectedCharacterId);
      }
    });

    window.deleteEncounter = function(logId) {
      const item = characters.find(c => c.id === selectedCharacterId);
      if (item) {
        item.logs = item.logs.filter(l => l.id !== logId);
        render();
        openProfileModal(selectedCharacterId);
      }
    };

    window.openEncounterModal = function() {
      document.getElementById('enc-date').valueAsDate = new Date();
      encounterOverlay.classList.add('active');
    };

    encounterForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const item = characters.find(c => c.id === selectedCharacterId);
      if (item) {
        const checkedBadges = Array.from(document.querySelectorAll('input[name="encounter-badges"]:checked')).map(cb => cb.value);

        const newLog = {
          id: "log-" + Date.now(),
          type: document.getElementById('enc-type').value,
          date: document.getElementById('enc-date').value,
          location: document.getElementById('enc-location').value,
          badges: checkedBadges,
          notes: document.getElementById('enc-notes').value
        };

        item.logs.unshift(newLog);
        encounterForm.reset();
        encounterOverlay.classList.remove('active');
        render();
        openProfileModal(selectedCharacterId);
      }
    });

    addForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const newChar = {
        id: Date.now().toString(),
        name: document.getElementById('add-name').value,
        race: document.getElementById('add-race').value,
        hair: document.getElementById('add-hair').value,
        avatar: document.getElementById('add-avatar').value || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
        logs: []
      };

      characters.push(newChar);
      addForm.reset();
      addOverlay.classList.remove('active');
      render();
    });

    searchInput.addEventListener('input', render);
    raceFilter.addEventListener('change', render);
    hairFilter.addEventListener('change', render);
    ratingFilter.addEventListener('change', render);

    btnGrid.addEventListener('click', () => {
      currentView = 'grid';
      btnGrid.classList.add('active');
      btnList.classList.remove('active');
      render();
    });

    btnList.addEventListener('click', () => {
      currentView = 'list';
      btnList.classList.add('active');
      btnGrid.classList.remove('active');
      render();
    });

    openAddBtn.addEventListener('click', () => addOverlay.classList.add('active'));
    closeAdd.addEventListener('click', () => addOverlay.classList.remove('active'));
    closeEdit.addEventListener('click', () => editOverlay.classList.remove('active'));
    closeProfile.addEventListener('click', () => profileOverlay.classList.remove('active'));
    closeEncounter.addEventListener('click', () => encounterOverlay.classList.remove('active'));

    profileOverlay.addEventListener('click', (e) => {
      if (e.target === profileOverlay) profileOverlay.classList.remove('active');
    });
    addOverlay.addEventListener('click', (e) => {
      if (e.target === addOverlay) addOverlay.classList.remove('active');
    });
    editOverlay.addEventListener('click', (e) => {
      if (e.target === editOverlay) editOverlay.classList.remove('active');
    });
    encounterOverlay.addEventListener('click', (e) => {
      if (e.target === encounterOverlay) encounterOverlay.classList.remove('active');
    });

    renderBadgeCheckboxes();
    render();
  </script>
</body>
</html>
