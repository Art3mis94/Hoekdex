<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tracker Hub</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: #151c2c;
      --bg-hover: #1e293b;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --border: #243048;
      --danger: #ef4444;
      
      --common: #94a3b8;
      --rare: #3b82f6;
      --ultra-rare: #a855f7;
      --legendary: #eab308;
      --star-gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      padding: 0.75rem;
      padding-bottom: 2rem;
      min-height: 100vh;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: 0.85rem;
      margin-bottom: 1rem;
    }

    .nav-logo {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .nav-links {
      display: flex;
      gap: 0.35rem;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.4rem 0.75rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:hover, .nav-btn.active {
      color: var(--text-primary);
      background: var(--bg-hover);
    }

    .nav-btn.active {
      border-color: var(--accent);
    }

    /* Tab Views */
    .tab-view {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .tab-view.active {
      display: flex;
    }

    /* Cards & Containers */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      padding: 1rem;
    }

    .card-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    /* Buttons */
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: background 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--bg-hover);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: var(--danger);
    }

    /* Character Cards */
    .char-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .char-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .char-info h4 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .char-tags {
      display: flex;
      gap: 0.4rem;
    }

    .tag {
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 0.3rem;
      background: var(--bg-hover);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .char-actions {
      display: flex;
      gap: 0.4rem;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      padding: 1.25rem;
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .form-control {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.6rem;
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    /* Badges Selection Grid */
    .badge-select-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.4rem;
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid var(--border);
      padding: 0.5rem;
      border-radius: 0.5rem;
      background: var(--bg-dark);
    }

    .badge-checkbox {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* Metrics & Stats Page Elements */
    .level-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .level-badge {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
    }

    .exp-counter {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .exp-bar-bg {
      background: var(--bg-dark);
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-top: 0.5rem;
    }

    .exp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #a855f7);
      width: 0%;
      transition: width 0.4s ease;
    }

    .metric-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.85rem 0.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .metric-value {
      font-size: 1.35rem;
      font-weight: 800;
    }

    .metric-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .stacked-bar {
      height: 14px;
      border-radius: 7px;
      background: var(--bg-dark);
      display: flex;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 0.75rem;
    }

    .bar-segment { height: 100%; }
    .seg-human { background: #ec4899; }
    .seg-elf { background: #8b5cf6; }
    .seg-cyborg { background: #06b6d4; }
    .seg-blonde { background: #eab308; }
    .seg-dark { background: #475569; }
    .seg-silver { background: #cbd5e1; }
    .seg-red { background: #f97316; }

    .badge-collection-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .badge-grid-6x2 {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.6rem 0.2rem;
      width: 100%;
    }

    .badge-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.2rem;
    }

    .badge-symbol { font-size: 1.5rem; }
    .badge-name { font-size: 0.6rem; color: var(--text-muted); }
    .badge-item.locked { opacity: 0.2; filter: grayscale(100%); }
    .badge-item.unlocked .badge-name { color: var(--text-primary); font-weight: 700; }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-logo">Tracker Hub</div>
    <div class="nav-links">
      <button class="nav-btn active" onclick="switchTab('home')">Home</button>
      <button class="nav-btn" onclick="switchTab('catches')">Catches</button>
      <button class="nav-btn" onclick="switchTab('stats')">Stats</button>
    </div>
  </nav>

  <!-- HOME TAB -->
  <section id="tab-home" class="tab-view active">
    <div class="card">
      <div class="card-title">Quick Actions</div>
      <button class="btn" onclick="openAddModal()">+ Add New Catch</button>
    </div>
    <div class="card">
      <div class="card-title">Recent Activity</div>
      <div id="home-activity">No recent activity logged.</div>
    </div>
  </section>

  <!-- CATCHES TAB -->
  <section id="tab-catches" class="tab-view">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 style="font-size: 1rem;">Character Roster</h3>
      <button class="btn" onclick="openAddModal()">+ Add Character</button>
    </div>
    <div class="char-grid" id="char-roster"></div>
  </section>

  <!-- STATS TAB -->
  <section id="tab-stats" class="tab-view">
    <div class="card">
      <div class="level-header">
        <div>
          <div class="card-title" style="margin-bottom:0.2rem;">Personal Rank</div>
          <div class="level-badge" id="player-level">Level 1</div>
        </div>
        <div class="exp-counter" id="exp-display">0 / 10 EXP</div>
      </div>
      <div class="exp-bar-bg">
        <div class="exp-bar-fill" id="exp-bar"></div>
      </div>
    </div>

    <div class="metric-row">
      <div class="metric-card">
        <div class="metric-label">Catches</div>
        <div class="metric-value" id="stat-catches">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Encounters</div>
        <div class="metric-value" id="stat-encounters">0</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Race Distribution</div>
      <div class="stacked-bar" id="race-bar"></div>
    </div>

    <div class="card">
      <div class="card-title">Badge Showcase</div>
      <div class="badge-collection-wrapper">
        <div id="legendary-slot"></div>
        <div class="badge-grid-6x2" id="grid-6x2"></div>
      </div>
    </div>
  </section>

  <!-- ADD / EDIT CHARACTER MODAL -->
  <div class="modal-overlay" id="char-modal">
    <div class="modal">
      <div class="modal-title" id="char-modal-title">Add Character</div>
      <div class="form-group">
        <label>Character Name</label>
        <input type="text" id="char-name" class="form-control" placeholder="Enter name">
      </div>
      <div class="form-group">
        <label>Race</label>
        <select id="char-race" class="form-control">
          <option value="Human">Human</option>
          <option value="Elf">Elf</option>
          <option value="Cyborg">Cyborg</option>
        </select>
      </div>
      <div class="form-group">
        <label>Hair Color</label>
        <select id="char-hair" class="form-control">
          <option value="Blonde">Blonde</option>
          <option value="Dark">Dark</option>
          <option value="Silver">Silver</option>
          <option value="Red">Red</option>
        </select>
      </div>
      <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 0.5rem;">
        <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
        <button class="btn" onclick="saveCharacter()">Save</button>
      </div>
    </div>
  </div>

  <!-- LOG ENCOUNTER MODAL -->
  <div class="modal-overlay" id="log-modal">
    <div class="modal">
      <div class="modal-title">Log Encounter</div>
      <div class="form-group">
        <label>Star Rating (1 - 5)</label>
        <select id="log-stars" class="form-control">
          <option value="5">★★★★★ (5 Stars)</option>
          <option value="4">★★★★☆ (4 Stars)</option>
          <option value="3">★★★☆☆ (3 Stars)</option>
          <option value="2">★★☆☆☆ (2 Stars)</option>
          <option value="1">★☆☆☆☆ (1 Star)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Earned Badges</label>
        <div class="badge-select-grid" id="badge-options"></div>
      </div>
      <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
        <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
        <button class="btn" onclick="saveEncounterLog()">Log Encounter</button>
      </div>
    </div>
  </div>

  <script>
    const BADGES = [
      { name: "Apex Mastery 👑", rarity: "Legendary", exp: 20 },
      { name: "Flawless Execution 💎", rarity: "Ultra-Rare", exp: 15 },
      { name: "MVP Contender 🌟", rarity: "Ultra-Rare", exp: 15 },
      { name: "Boss Slayer 🐉", rarity: "Ultra-Rare", exp: 15 },
      { name: "Tactical Genius 🧠", rarity: "Ultra-Rare", exp: 15 },
      { name: "Critical Strike 💥", rarity: "Rare", exp: 10 },
      { name: "First Blood ⚡", rarity: "Rare", exp: 10 },
      { name: "Unshakable Shield 🛡️", rarity: "Rare", exp: 10 },
      { name: "Speed Demon 🚀", rarity: "Rare", exp: 10 },
      { name: "Participant 🎖️", rarity: "Common", exp: 5 },
      { name: "Team Player 🤝", rarity: "Common", exp: 5 },
      { name: "Scout Duty 🔍", rarity: "Common", exp: 5 },
      { name: "First Step 🐾", rarity: "Common", exp: 5 }
    ];

    let characters = JSON.parse(localStorage.getItem('roster_characters_v6')) || [];
    let activeCharId = null;

    function saveToStorage() {
      localStorage.setItem('roster_characters_v6', JSON.stringify(characters));
      renderRoster();
      renderStats();
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'stats') renderStats();
    }

    function openAddModal() {
      activeCharId = null;
      document.getElementById('char-modal-title').textContent = "Add Character";
      document.getElementById('char-name').value = '';
      document.getElementById('char-modal').classList.add('active');
    }

    function closeModals() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
    }

    function saveCharacter() {
      const name = document.getElementById('char-name').value.trim();
      const race = document.getElementById('char-race').value;
      const hair = document.getElementById('char-hair').value;

      if (!name) return alert("Enter a character name");

      if (activeCharId) {
        const char = characters.find(c => c.id === activeCharId);
        if (char) { char.name = name; char.race = race; char.hair = hair; }
      } else {
        characters.push({ id: Date.now(), name, race, hair, logs: [] });
      }

      closeModals();
      saveToStorage();
    }

    function renderRoster() {
      const rosterContainer = document.getElementById('char-roster');
      rosterContainer.innerHTML = '';

      if (characters.length === 0) {
        rosterContainer.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:2rem 0;">No characters captured yet.</div>';
        return;
      }

      characters.forEach(c => {
        const div = document.createElement('div');
        div.className = 'char-card';
        div.innerHTML = `
          <div class="char-info">
            <h4>${c.name}</h4>
            <div class="char-tags">
              <span class="tag">${c.race}</span>
              <span class="tag">${c.hair}</span>
              <span class="tag">${(c.logs || []).length} Encounters</span>
            </div>
          </div>
          <div class="char-actions">
            <button class="btn btn-secondary" onclick="openLogModal(${c.id})">+ Log</button>
            <button class="btn btn-danger" onclick="deleteChar(${c.id})">✕</button>
          </div>
        `;
        rosterContainer.appendChild(div);
      });
    }

    function deleteChar(id) {
      if (confirm("Delete this character?")) {
        characters = characters.filter(c => c.id !== id);
        saveToStorage();
      }
    }

    function openLogModal(id) {
      activeCharId = id;
      const optionsContainer = document.getElementById('badge-options');
      optionsContainer.innerHTML = '';

      BADGES.forEach(b => {
        optionsContainer.innerHTML += `
          <label class="badge-checkbox">
            <input type="checkbox" value="${b.name}"> ${b.name}
          </label>
        `;
      });

      document.getElementById('log-modal').classList.add('active');
    }

    function saveEncounterLog() {
      const stars = parseInt(document.getElementById('log-stars').value);
      const selectedBadges = Array.from(document.querySelectorAll('#badge-options input:checked')).map(cb => cb.value);

      const char = characters.find(c => c.id === activeCharId);
      if (char) {
        if (!char.logs) char.logs = [];
        char.logs.push({ stars, badges: selectedBadges, timestamp: Date.now() });
      }

      closeModals();
      saveToStorage();
    }

    function renderStats() {
      let totalEncounters = 0;
      let unlockedBadges = new Set();
      let raceCounts = { Human: 0, Elf: 0, Cyborg: 0 };

      characters.forEach(c => {
        if (raceCounts[c.race] !== undefined) raceCounts[c.race]++;
        (c.logs || []).forEach(l => {
          totalEncounters++;
          (l.badges || []).forEach(b => unlockedBadges.add(b));
        });
      });

      document.getElementById('stat-catches').textContent = characters.length;
      document.getElementById('stat-encounters').textContent = totalEncounters;

      // Badge Grid
      const grid = document.getElementById('grid-6x2');
      const legSlot = document.getElementById('legendary-slot');
      grid.innerHTML = ''; legSlot.innerHTML = '';

      BADGES.forEach((b, idx) => {
        const isUnlocked = unlockedBadges.has(b.name);
        const parts = b.name.split(' ');
        const symbol = parts.pop();
        const name = parts.join(' ');

        const elem = document.createElement('div');
        elem.className = `badge-item ${isUnlocked ? 'unlocked' : 'locked'}`;
        elem.innerHTML = `<div class="badge-symbol">${symbol}</div><div class="badge-name">${name}</div>`;

        if (idx === 0) legSlot.appendChild(elem);
        else grid.appendChild(elem);
      });
    }

    // Init
    renderRoster();
    renderStats();
  </script>
</body>
</html>
